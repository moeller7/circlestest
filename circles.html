<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Circles</title>
</head>
<body>

<h1 id="userBubble"></h1>

<button onclick="createCircle()">Create Circle</button>

<h3>Your circles</h3>
<div id="circleList"></div>

<button onclick="logout()">Log out</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
    getAuth,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    updateDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBKUqKM5ymlj2He3Nuq6q8BvOfxCZ8-Vzw",
  authDomain: "circles-4c684.firebaseapp.com",
  projectId: "circles-4c684",
  storageBucket: "circles-4c684.firebasestorage.app",
  messagingSenderId: "733616859510",
  appId: "1:733616859510:web:0a343fbc6458a44917f257"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUid = null;
let currentUserDoc = null;

onAuthStateChanged(auth, async user => {
    if (!user) {
        window.location = "index.html";
        return;
    }

    currentUid = user.uid;

    const userRef = doc(db, "users", currentUid);
    const snap = await getDoc(userRef);

    if (!snap.exists()) {
        // Create empty profile if missing
        await setDoc(userRef, {
            email: user.email,
            circles: {}
        });
        currentUserDoc = { circles: {} };
    } else {
        currentUserDoc = snap.data();
        if (!currentUserDoc.circles) {
            currentUserDoc.circles = {};
        }
    }

    document.getElementById("userBubble").textContent =
        currentUserDoc.username || user.email;

    renderCircles();
});

function renderCircles() {
    const list = document.getElementById("circleList");
    list.innerHTML = "";

    const circles = currentUserDoc.circles;
    const names = Object.keys(circles);

    if (names.length === 0) {
        list.textContent = "No circles yet.";
        return;
    }

    for (const name of names) {
        const div = document.createElement("div");
        div.textContent = name;
        list.appendChild(div);
    }
}

window.createCircle = async function () {
    const name = prompt("Circle name:");
    if (!name) return;

    if (!currentUserDoc || !currentUid) {
        alert("User not loaded yet.");
        return;
    }

    if (currentUserDoc.circles[name]) {
        alert("Circle already exists.");
        return;
    }

    const userRef = doc(db, "users", currentUid);

    currentUserDoc.circles[name] = [];

    await updateDoc(userRef, {
        circles: currentUserDoc.circles
    });

    renderCircles();
};

window.logout = function () {
    signOut(auth).then(() => {
        window.location = "index.html";
    });
};
</script>

</body>
</html>
