<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Circles</title>
</head>
<body>

<h1 id="userBubble"></h1>

<button onclick="createCircle()">Create Circle</button>

<h3>Your circles</h3>
<div id="circleList"></div>

<button onclick="logout()">Log out</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBKUqKM5ymlj2He3Nuq6q8BvOfxCZ8-Vzw",
  authDomain: "circles-4c684.firebaseapp.com",
  projectId: "circles-4c684",
  storageBucket: "circles-4c684.firebasestorage.app",
  messagingSenderId: "733616859510",
  appId: "1:733616859510:web:0a343fbc6458a44917f257"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUserDoc = null;
let currentUid = null;

onAuthStateChanged(auth, async user => {
    if (!user) {
        window.location = "index.html";
        return;
    }

    currentUid = user.uid;

    const userRef = doc(db, "users", currentUid);
    const snap = await getDoc(userRef);

    if (!snap.exists()) {
        return;
    }

    currentUserDoc = snap.data();

    document.getElementById("userBubble").textContent =
        currentUserDoc.username;

    renderCircles();
});

function renderCircles() {
    const list = document.getElementById("circleList");
    list.innerHTML = "";

    const circles = currentUserDoc.circles || {};

    const names = Object.keys(circles);

    if (names.length === 0) {
        list.textContent = "No circles yet.";
        return;
    }

    for (const name of names) {
        const div = document.createElement("div");
        div.textContent = name;
        list.appendChild(div);
    }
}

window.createCircle = async function () {
    const name = prompt("Circle name:");
    if (!name) return;

    const userRef = doc(db, "users", currentUid);

    const circles = currentUserDoc.circles || {};

    if (circles[name]) {
        alert("Circle already exists");
        return;
    }

    circles[name] = [];

    await setDoc(userRef, { circles }, { merge: true });

    currentUserDoc.circles = circles;
    renderCircles();
};



window.logout = function () {
    signOut(auth).then(() => {
        window.location = "index.html";
    });
};
</script>

</body>
</html>
